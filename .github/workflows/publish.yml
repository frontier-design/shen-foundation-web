name: Publish to live site

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON (unused)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: branch-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check images are optimized
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          block() {
            echo "::error title=Images are still being optimized::$1 Nothing was published."
            printf '### Not published: images are still being optimized\n\n%s\n\nNothing was published.\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow optimize-images.yml --branch preview --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$running" -gt 0 ]; then
            block "An Optimize images run is still in progress on preview. Wait a minute or two, check the preview site, then click Publish again."
          fi
          trap 'git worktree remove --force ../preview-check >/dev/null 2>&1 || true' EXIT
          git worktree add -f -q ../preview-check origin/preview
          checker=../preview-check/scripts/optimize-images/optimize.mjs
          if [ -f "$checker" ]; then
            status=0
            out=$(node "$checker" --check) || status=$?
            echo "$out"
            if [ "$status" -eq 3 ]; then
              files=$(echo "$out" | sed -n 's/^  //p' | tr '\n' ' ')
              block "These images or videos on preview haven't been processed yet: ${files}Wait a minute or two and click Publish again. If this keeps happening, run the Optimize images workflow from the repository's Actions tab."
            elif [ "$status" -ne 0 ]; then
              echo "::warning title=Image check skipped::The image optimization check failed to run (exit $status), so publishing continues without it."
            fi
          fi
          embeds=../preview-check/scripts/optimize-images/embeds.mjs
          if [ -f "$embeds" ]; then
            status=0
            out=$(node "$embeds" --check) || status=$?
            echo "$out"
            if [ "$status" -eq 3 ]; then
              links=$(echo "$out" | sed -n 's/^  //p' | tr '\n' ' ')
              block "These YouTube/Vimeo videos don't have thumbnails yet: ${links}Wait a minute or two and click Publish again."
            elif [ "$status" -ne 0 ]; then
              echo "::warning title=Video thumbnail check skipped::The video thumbnail check failed to run (exit $status), so publishing continues without it."
            fi
          fi

      - name: Merge preview into main
        run: |
          git config user.name "Pages CMS Publish"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit origin/preview; then
            conflicts="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git merge --abort
            echo "::error title=Publish failed::Merge conflict between preview and main in: ${conflicts:-unknown files}. Nothing was published. Resolve the conflict on preview, then publish again."
            exit 1
          fi

      - name: Push main
        run: git push origin main
