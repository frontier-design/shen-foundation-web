# Pages CMS config — https://pagescms.org/docs/configuration
media:
  input: public/media
  output: /media
  categories: [image]
  rename: safe

content:
  - name: site
    label: Site
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: tagline
        label: Tagline
        type: string
        options:
          maxlength: 200
      - name: description
        label: Description
        type: text
        options:
          maxlength: 320

  - name: pages
    label: Pages
    type: collection
    path: content/pages
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      fields: [title, slug]
      primary: title
      sort: [title]
      search: [title, slug]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        options:
          minlength: 1
          maxlength: 80
      - name: description
        label: Description
        type: text
        options:
          maxlength: 320
      - name: heroImages
        label: Hero carousel
        type: image
        options:
          multiple:
            max: 12
          unique: true
          categories: [image]
          path: public/media
          rename: safe
      - name: callout
        label: Homepage callout
        type: object
        fields:
          - name: enabled
            label: Show callout
            type: boolean
          - name: exhibition
            label: Exhibition
            type: reference
            description: "Feature an Exhibition. Leave Event blank."
            options:
              collection: exhibitions
              search: title,subtitle,slug
              label: "{title} — {subtitle}"
          - name: event
            label: Event
            type: reference
            description: "Feature an Event. Leave Exhibition blank."
            options:
              collection: events
              search: title,slug
              label: "{title}"
          - name: image
            label: Image override (optional)
            type: image
            description: "Optional. Defaults to the referenced item's hero/thumbnail image."
            options:
              categories: [image]
              path: public/media
      - name: grid
        label: Homepage grid
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{exhibition}{event}"
        fields:
          - name: exhibition
            label: Exhibition
            type: reference
            description: "Feature an Exhibition. Leave Event blank on this row."
            options:
              collection: exhibitions
              search: title,subtitle,slug
              label: "{title} — {subtitle}"
          - name: event
            label: Event
            type: reference
            description: "Feature an Event. Leave Exhibition blank on this row."
            options:
              collection: events
              search: title,slug
              label: "{title}"
      - name: artists
        label: Artists
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: image
            label: Image
            type: image
            options:
              categories: [image]
              path: public/media
          - name: title
            label: Title
            type: string

  - name: exhibitions
    label: Exhibitions
    type: collection
    path: content/exhibitions
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      fields: [title, subtitle, status, slug]
      primary: title
      sort: [title]
      search: [title, subtitle, slug]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Must match the Slug on the matching home grid card so the card links here."
        options:
          minlength: 1
          maxlength: 80
      - name: status
        label: Status
        type: select
        default: ongoing
        description: "Controls which tab this appears under on the Exhibitions & Projects page."
        options:
          values: [ongoing, archive]
      - name: subtitle
        label: Subtitle
        type: string
        options:
          maxlength: 160
      - name: heroImage
        label: Hero image (full bleed)
        type: image
        options:
          categories: [image]
          path: public/media
      - name: captionLabel
        label: Caption label
        type: string
      - name: captionDate
        label: Caption date
        type: string
      - name: captionLocation
        label: Caption location
        type: string
      - name: body
        label: Body text
        type: text
        options:
          maxlength: 1200
      - name: artistLinkLabel
        label: Artist link label
        type: string
      - name: artistLinkUrl
        label: Artist link URL
        type: string
      - name: gallery
        label: Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: image
            label: Image
            type: image
            options:
              categories: [image]
              path: public/media
          - name: caption
            label: Caption
            type: string

  - name: events
    label: Events
    type: collection
    path: content/events
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      fields: [title, captionLabel, status, slug]
      primary: title
      sort: [title]
      search: [title, slug]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "Must match the Slug/Title on the matching home grid card so the card links here."
        options:
          minlength: 1
          maxlength: 80
      - name: status
        label: Status
        type: select
        default: ongoing
        description: "Archived events move to the Archive tab on the Events page."
        options:
          values: [ongoing, archive]
      - name: captionLabel
        label: Caption label
        type: string
      - name: captionDate
        label: Caption date
        type: string
      - name: captionLocation
        label: Caption location
        type: string
      - name: image
        label: Thumbnail image
        type: image
        options:
          categories: [image]
          path: public/media
      - name: sections
        label: Accordion sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
          - name: content
            label: Content
            type: text

settings:
  content:
    merge: true
