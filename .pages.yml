# Pages CMS config — https://pagescms.org/docs/configuration
media:
  input: public/media
  output: /media
  categories: [image]
  rename: safe

content:
  - name: site
    label: Site
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: tagline
        label: Tagline
        type: string
        options:
          maxlength: 200
      - name: description
        label: Description
        type: text
        options:
          maxlength: 320

  - name: pages
    label: Pages
    type: collection
    path: content/pages
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      fields: [title, slug]
      primary: title
      sort: [title]
      search: [title, slug]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        options:
          minlength: 1
          maxlength: 80
      - name: description
        label: Description
        type: text
        options:
          maxlength: 320
      - name: heroImages
        label: Hero carousel
        type: image
        options:
          multiple:
            max: 12
          unique: true
          categories: [image]
          path: public/media
          rename: safe
      - name: body
        label: Body
        type: rich-text
        options:
          format: html

settings:
  content:
    merge: true
