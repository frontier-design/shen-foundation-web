# Pages CMS config — https://pagescms.org/docs/configuration
media:
  input: public/media
  output: /media
  extensions: [jpg, jpeg, png, webp, avif, gif, mp4, webm]
  rename: safe

content:
  - name: home
    label: Home
    type: file
    path: content/pages/home.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: heroSlides
        label: Hero carousel
        type: reference
        options:
          collection: exhibitions
          multiple: true
          search: title,subtitle
          label: "{title} — {subtitle}"
      - name: callout
        label: Homepage callout
        type: object
        fields:
          - name: enabled
            label: Show callout
            type: boolean
          - name: feature
            label: Featured item
            type: block
            blockKey: type
            blocks:
              - name: exhibition
                label: Exhibition
                fields:
                  - name: exhibition
                    label: Exhibition
                    type: reference
                    required: true
                    options:
                      collection: exhibitions
                      search: title,subtitle
                      label: "{title} — {subtitle}"
              - name: event
                label: Event
                fields:
                  - name: event
                    label: Event
                    type: reference
                    required: true
                    options:
                      collection: events
                      search: title
                      label: "{title}"
          - name: image
            label: Image (portrait)
            type: image
            required: true
            description: "Portrait only. Landscape images are not accepted here."
            options:
              categories: [image]
              path: public/media
          - name: imageVideo
            label: Video (optional, portrait)
            type: file
            description: "Plays muted on a loop in place of the image. Portrait only. MP4 or WebM, ideally under 20 MB; remove location data from phone footage. Keep the image above: it shows while the video loads and for visitors who prefer reduced motion."
            options:
              extensions: [mp4, webm]
              path: public/media
      - name: grid
        label: Homepage grid
        type: block
        blockKey: type
        list:
          collapsible:
            collapsed: true
            summary: "{exhibition}{event}"
        blocks:
          - name: exhibition
            label: Exhibition
            fields:
              - name: exhibition
                label: Exhibition
                type: reference
                required: true
                options:
                  collection: exhibitions
                  search: title,subtitle
                  value: "{subtitle}"
                  label: "{title} — {subtitle}"
          - name: event
            label: Event
            fields:
              - name: event
                label: Event
                type: reference
                required: true
                options:
                  collection: events
                  search: title
                  value: "{title}"
                  label: "{title}"

  - name: artistsPage
    label: Artists page
    type: file
    path: content/pages/artists.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: artistOrder
        label: Artist order
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{artist}"
        fields:
          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: title
              value: "{title}"
              label: "{title}"

  - name: aboutPage
    label: About page
    type: file
    path: content/pages/about.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: heroImage
        label: Hero image (full bleed)
        type: image
        description: "Fills the top of the page behind the white card."
        options:
          categories: [image]
          path: public/media
      - name: heroVideo
        label: Hero video (optional)
        type: file
        description: "Plays muted on a loop in place of the hero image. MP4 or WebM, ideally under 20 MB; remove location data from phone footage. Keep the image above: it shows while the video loads and for visitors who prefer reduced motion."
        options:
          extensions: [mp4, webm]
          path: public/media
      - name: heroBody
        label: About Us body copy
        type: rich-text
        description: "Shown under the 'About Us' title in the white hero card. Keep it under about 600 characters so it fits the card. Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
        options:
          format: html
          media: false
          switcher: false
      - name: intro
        label: Intro section
        type: object
        description: "Title and body blocks directly under the hero. Drag to reorder."
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            options:
              maxlength: 120
          - name: body
            label: Body
            type: rich-text
            description: "Shown beside the title. Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
            options:
              format: html
              media: false
              switcher: false
      - name: people
        label: People
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {role}"
        fields:
          - name: name
            label: Name
            type: string
            options:
              maxlength: 120
          - name: role
            label: Role
            type: string
            options:
              maxlength: 120
          - name: bio
            label: Bio
            type: rich-text
            description: "Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
            options:
              format: html
              media: false
              switcher: false
          - name: photo
            label: Photo
            type: image
            options:
              categories: [image]
              path: public/media
          - name: photoVideo
            label: Video (optional)
            type: file
            description: "Plays muted on a loop in place of the photo. Use sparingly. MP4 or WebM, ideally under 20 MB; remove location data from phone footage. Keep the image above: it shows while the video loads and for visitors who prefer reduced motion."
            options:
              extensions: [mp4, webm]
              path: public/media

  - name: artists
    label: Artists
    type: collection
    path: content/artists
    format: json
    filename:
      template: "{fields.title}.json"
      field: false
    view:
      fields: [title]
      primary: title
      sort: [title]
      search: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Artist
        type: string
        required: true
        options:
          maxlength: 120
      - name: bio
        label: Bio
        type: rich-text
        description: "Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
        options:
          format: html
          media: false
          switcher: false
      - name: thumbnail
        label: Thumbnail
        type: image
        options:
          categories: [image]
          path: public/media
      - name: thumbnailVideo
        label: Video (optional)
        type: file
        description: "Plays muted on a loop in place of the thumbnail on the artist's page. The Artists list still shows the thumbnail. MP4 or WebM, ideally under 20 MB; remove location data from phone footage. Keep the image above: it shows while the video loads and for visitors who prefer reduced motion."
        options:
          extensions: [mp4, webm]
          path: public/media

  - name: exhibitions
    label: Exhibitions
    type: collection
    path: content/exhibitions
    format: json
    filename:
      template: "{fields.subtitle}.json"
      field: false
    view:
      fields: [title, subtitle, status]
      primary: title
      sort: [title]
      search: [title, subtitle]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: status
        label: Status
        type: select
        default: ongoing
        description: "Controls which tab this appears under on the Exhibitions & Projects page."
        options:
          values: [ongoing, archive]
      - name: subtitle
        label: Artwork
        type: string
        required: true
        description: "The project/exhibition name. Also used to generate the page URL."
        options:
          maxlength: 160
      - name: heroImage
        label: Hero image (landscape)
        type: image
        description: "Landscape only. Also used as the project thumbnail in grids. Portrait images are not accepted."
        options:
          categories: [image]
          path: public/media
      - name: heroVideo
        label: Hero video (optional, landscape)
        type: file
        description: "Plays muted on a loop in place of the hero image, on this exhibition's page and in the homepage carousel. Grids still show the hero image. MP4 or WebM, ideally under 20 MB; remove location data from phone footage. Keep the image above: it shows while the video loads and for visitors who prefer reduced motion."
        options:
          extensions: [mp4, webm]
          path: public/media
      - name: startDate
        label: Start date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        default: ""
        description: "Leave empty for a single-day date."
        options:
          format: yyyy-MM-dd
      - name: captionLocation
        label: Location
        type: string
      - name: body
        label: Body text
        type: rich-text
        description: "Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
        options:
          format: html
          media: false
          switcher: false
      - name: gallery
        label: Gallery
        type: block
        blockKey: type
        description: "Images and videos, shown in two staggered columns. Drag to reorder."
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        blocks:
          - name: image
            label: Image
            fields:
              - name: image
                label: Image
                type: image
                required: true
                description: "Any dimensions."
                options:
                  categories: [image]
                  path: public/media
              - name: caption
                label: Caption
                type: string
          - name: video
            label: Video
            fields:
              - name: video
                label: Video
                type: file
                required: true
                description: "Plays muted on a loop while on screen. Any dimensions. MP4 or WebM, ideally under 20 MB; remove location data from phone footage."
                options:
                  extensions: [mp4, webm]
                  path: public/media
              - name: poster
                label: Poster image (recommended)
                type: image
                description: "A still from the video. Shown while the video loads and for visitors who prefer reduced motion. Without one, the video's first frame is shown."
                options:
                  categories: [image]
                  path: public/media
              - name: caption
                label: Caption
                type: string
          - name: embed
            label: YouTube or Vimeo video
            fields:
              - name: url
                label: Video link
                type: string
                required: true
                description: "The video loads only when a visitor presses play. Its thumbnail is fetched automatically a minute or two after saving."
                pattern:
                  regex: '^https?://(www\.|m\.)?(youtube\.com/(watch\?(.*&)?v=|shorts/|embed/|live/)[A-Za-z0-9_-]{11}|youtu\.be/[A-Za-z0-9_-]{11}|youtube-nocookie\.com/embed/[A-Za-z0-9_-]{11}|(player\.)?vimeo\.com/(.*/)?[0-9]+)([/?#&].*)?$'
                  message: "Paste a YouTube link (youtube.com/watch?v=…, youtu.be/…, youtube.com/shorts/…) or a Vimeo link (vimeo.com/…, including unlisted links)."
              - name: thumbnail
                label: Thumbnail (optional)
                type: image
                description: "Replaces the automatic thumbnail."
                options:
                  categories: [image]
                  path: public/media
              - name: caption
                label: Caption
                type: string

  - name: events
    label: Events
    type: collection
    path: content/events
    format: json
    filename:
      template: "{fields.title}.json"
      field: false
    view:
      fields: [title, captionLabel, status]
      primary: title
      sort: [title]
      search: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: status
        label: Status
        type: select
        default: ongoing
        description: "Archived events move to the Archive tab on the Events page."
        options:
          values: [ongoing, archive]
      - name: captionLabel
        label: Event Type
        type: string
        description: "e.g. Talk, Workshop, Tour. Becomes a filter tab on the Events page."
      - name: startDate
        label: Start date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        default: ""
        description: "Leave empty for a single-day date."
        options:
          format: yyyy-MM-dd
      - name: captionLocation
        label: Location
        type: string
      - name: image
        label: Thumbnail image (landscape)
        type: image
        description: "Landscape only. Portrait images are not accepted."
        options:
          categories: [image]
          path: public/media
      - name: imageVideo
        label: Video (optional, landscape)
        type: file
        description: "Plays muted on a loop in place of the image on this event's page. Grids still show the image. MP4 or WebM, ideally under 20 MB; remove location data from phone footage. Keep the image above: it shows while the video loads and for visitors who prefer reduced motion."
        options:
          extensions: [mp4, webm]
          path: public/media
      - name: embed
        label: Video (YouTube or Vimeo, optional)
        type: object
        description: "Shown under the date and location on the event page."
        fields:
          - name: url
            label: Video link
            type: string
            description: "The video loads only when a visitor presses play. Its thumbnail is fetched automatically a minute or two after saving."
            pattern:
              regex: '^$|^https?://(www\.|m\.)?(youtube\.com/(watch\?(.*&)?v=|shorts/|embed/|live/)[A-Za-z0-9_-]{11}|youtu\.be/[A-Za-z0-9_-]{11}|youtube-nocookie\.com/embed/[A-Za-z0-9_-]{11}|(player\.)?vimeo\.com/(.*/)?[0-9]+)([/?#&].*)?$'
              message: "Paste a YouTube link (youtube.com/watch?v=…, youtu.be/…, youtube.com/shorts/…) or a Vimeo link (vimeo.com/…, including unlisted links)."
          - name: thumbnail
            label: Thumbnail (optional)
            type: image
            description: "Replaces the automatic thumbnail."
            options:
              categories: [image]
              path: public/media
          - name: caption
            label: Caption
            type: string
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
          - name: content
            label: Content
            type: rich-text
            description: "Supports bold, italic, links and lists. Headings, quotes, tables and code show as plain text."
            options:
              format: html
              media: false
              switcher: false

settings:
  content:
    merge: true

actions:
  - name: publish
    label: Publish to live site
    workflow: publish.yml
    ref: current
    confirm:
      title: Publish to live site?
      message: "Check the preview site first: https://shen-foundation-web-git-preview-frontier-design.vercel.app/ This makes everything currently on the preview site live. The live site updates about a minute later."
      button: Publish
