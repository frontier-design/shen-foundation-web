# Pages CMS config — https://pagescms.org/docs/configuration
media:
  input: public/media
  output: /media
  categories: [image]
  rename: safe

content:
  - name: site
    label: Site
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: tagline
        label: Tagline
        type: string
        options:
          maxlength: 200
      - name: description
        label: Description
        type: text
        options:
          maxlength: 320

  - name: home
    label: Home
    type: file
    path: content/pages/home.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: heroImages
        label: Hero carousel
        type: image
        options:
          multiple:
            max: 12
          unique: true
          categories: [image]
          path: public/media
          rename: safe
      - name: callout
        label: Homepage callout
        type: object
        fields:
          - name: enabled
            label: Show callout
            type: boolean
          - name: feature
            label: Featured item
            type: block
            blockKey: type
            blocks:
              - name: exhibition
                label: Exhibition
                fields:
                  - name: exhibition
                    label: Exhibition
                    type: reference
                    required: true
                    options:
                      collection: exhibitions
                      search: title,subtitle,slug
                      label: "{title} — {subtitle}"
              - name: event
                label: Event
                fields:
                  - name: event
                    label: Event
                    type: reference
                    required: true
                    options:
                      collection: events
                      search: title,slug
                      label: "{title}"
          - name: image
            label: Image (portrait)
            type: image
            required: true
            description: "Portrait only. Landscape images are not accepted here."
            options:
              categories: [image]
              path: public/media
      - name: grid
        label: Homepage grid
        type: block
        blockKey: type
        list:
          collapsible:
            collapsed: true
            summary: "{type}: {exhibition}{event}"
        blocks:
          - name: exhibition
            label: Exhibition
            fields:
              - name: exhibition
                label: Exhibition
                type: reference
                required: true
                options:
                  collection: exhibitions
                  search: title,subtitle,slug
                  label: "{title} — {subtitle}"
          - name: event
            label: Event
            fields:
              - name: event
                label: Event
                type: reference
                required: true
                options:
                  collection: events
                  search: title,slug
                  label: "{title}"

  - name: artistsPage
    label: Artists page
    type: file
    path: content/pages/artists.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: artistOrder
        label: Artist order
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{artist}"
        fields:
          - name: artist
            label: Artist
            type: reference
            options:
              collection: artists
              search: title,slug
              label: "{title}"

  - name: aboutPage
    label: About page
    type: file
    path: content/pages/about.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Shown as the large heading on the white card. Displayed in uppercase."
        options:
          maxlength: 120
      - name: heroImage
        label: Hero image (full bleed)
        type: image
        description: "Fills the top of the page behind the white card."
        options:
          categories: [image]
          path: public/media
      - name: intro
        label: Intro section
        type: object
        description: "Title and body blocks directly under the hero. Drag to reorder."
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            options:
              maxlength: 120
          - name: body
            label: Body
            type: text
            description: "Shown beside the title."
            options:
              maxlength: 1200
      - name: people
        label: People
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {role}"
        fields:
          - name: name
            label: Name
            type: string
            options:
              maxlength: 120
          - name: role
            label: Role
            type: string
            options:
              maxlength: 120
          - name: bio
            label: Bio
            type: text
            options:
              maxlength: 2000
          - name: photo
            label: Photo
            type: image
            options:
              categories: [image]
              path: public/media

  - name: artists
    label: Artists
    type: collection
    path: content/artists
    format: json
    filename:
      template: "{fields.title}.json"
      field: create
    view:
      fields: [title]
      primary: title
      sort: [title]
      search: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: bio
        label: Bio
        type: text
        options:
          maxlength: 2000
      - name: thumbnail
        label: Thumbnail
        type: image
        options:
          categories: [image]
          path: public/media

  - name: exhibitions
    label: Exhibitions
    type: collection
    path: content/exhibitions
    format: json
    filename:
      template: "{fields.subtitle}.json"
      field: create
    view:
      fields: [title, subtitle, status]
      primary: title
      sort: [title]
      search: [title, subtitle]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: status
        label: Status
        type: select
        default: ongoing
        description: "Controls which tab this appears under on the Exhibitions & Projects page."
        options:
          values: [ongoing, archive]
      - name: subtitle
        label: Subtitle
        type: string
        required: true
        description: "The project/exhibition name. Also used to generate the page URL."
        options:
          maxlength: 160
      - name: heroImage
        label: Hero image (landscape)
        type: image
        description: "Landscape only. Also used as the project thumbnail in grids. Portrait images are not accepted."
        options:
          categories: [image]
          path: public/media
      - name: captionLabel
        label: Caption label
        type: string
      - name: startDate
        label: Start date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        default: ""
        description: "Leave empty for a single-day date."
        options:
          format: yyyy-MM-dd
      - name: captionLocation
        label: Caption location
        type: string
      - name: body
        label: Body text
        type: text
        options:
          maxlength: 1200
      - name: artistLinkLabel
        label: Artist link label
        type: string
      - name: artistLinkUrl
        label: Artist link URL
        type: string
      - name: gallery
        label: Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: image
            label: Image
            type: image
            description: "Any dimensions."
            options:
              categories: [image]
              path: public/media
          - name: caption
            label: Caption
            type: string

  - name: events
    label: Events
    type: collection
    path: content/events
    format: json
    filename:
      template: "{fields.title}.json"
      field: create
    view:
      fields: [title, captionLabel, status]
      primary: title
      sort: [title]
      search: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: status
        label: Status
        type: select
        default: ongoing
        description: "Archived events move to the Archive tab on the Events page."
        options:
          values: [ongoing, archive]
      - name: captionLabel
        label: Caption label
        type: string
      - name: startDate
        label: Start date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: End date (optional)
        type: date
        default: ""
        description: "Leave empty for a single-day date."
        options:
          format: yyyy-MM-dd
      - name: captionLocation
        label: Caption location
        type: string
      - name: image
        label: Thumbnail image (landscape)
        type: image
        description: "Landscape only. Portrait images are not accepted."
        options:
          categories: [image]
          path: public/media
      - name: sections
        label: Accordion sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
          - name: content
            label: Content
            type: text

settings:
  content:
    merge: true
